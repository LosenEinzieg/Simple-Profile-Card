<!DOCTYPE html>
<html>
<head>
    <title>Simple Project Profile Card</title>
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
    <body>
        <script src="script.js"></script>
        <div class="profile-card">
            <div class="corners">
                <p class="pro">PRO</p>
                <i class="bx bx-id-card bx-md"></i>
            </div>
            <div class="image">
                <img src="https://iili.io/3hcOuqu.jpg" alt="Logo Profile Card" width="175" class="profile-img">
            </div>
            <div class="text-data">
                <span class="name">Ade Arif Ramadhan</span>
                <span class="mailid">arif.ade727@gmail.com</span>
                <span class="job">Front-End Developer</span>
            </div>
            <div class="media-buttons">
                <a href="https://www.linkedin.com/in/ade-arif-ramadhan/" class="link"><i class="bx bxl-linkedin bx-sm"></i></a>
                <a href="#" class="link"><i class="bx bxl-github bx-sm"></i></a>
                <a href="https://www.instagram.com/ade_arif_r/" class="link"><i class="bx bxl-instagram bx-sm"></i></a>
            </div>
            <div class="buttons">
                <button class="button" id="streak">228 &#128293;</button>
                <button class="button">837 &#127794;</button>
            </div>
            <hr>
            <div class="analytics">
                <div class="edit-option">
                    <i class="bx bx-edit-alt bx-sm"></i>
                    <p>Edit your profile</p>
                </div>
            </div>
        </div>
    </body>
</html>
